default_install_hook_types:
    - pre-commit
    - pre-merge-commit
    - post-checkout
    - post-merge
    - post-rewrite
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix, lf]
          - id: check-yaml
          - id: check-added-large-files
            args: [--maxkb=2000]
          - id: check-merge-conflict
          - id: check-case-conflict
          - id: check-json
          - id: check-toml
          - id: pretty-format-json
            args: [--autofix, --no-ensure-ascii, --no-sort-keys]
    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt
            exclude: ^(\.pre-commit-config\.yaml|\.github/workflows/publish\.yml)$
    - repo: https://github.com/lovesegfault/beautysh
      rev: v6.2.1
      hooks:
          - id: beautysh
            exclude: ^scripts/hooks/
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.15.21
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format
    - repo: local
      hooks:
          - id: toml-sort
            name: toml-sort
            entry: toml-sort --in-place
            language: python
            additional_dependencies: [toml-sort>=0.23.1]
            types: [toml]
            exclude: ^uv\.lock$
          - id: check-file-line-count
            name: check-file-line-count
            entry: scripts/hooks/check_file_line_count.sh
            language: system
            types: [python]
          - id: check-directory-file-count
            name: check-directory-file-count
            entry: scripts/hooks/check_directory_file_count.sh
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-commit, pre-merge-commit, pre-push]
            args: [--include-regex, "[.](py|sh)$"]
          - id: check-tests-under-tests
            name: check-tests-under-tests
            entry: scripts/hooks/check_tests_under_tests.sh
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-commit, pre-merge-commit, pre-push]
          - id: check-array-annotations
            name: check-array-annotations
            entry: scripts/hooks/python/check_array_annotations.sh
            language: system
            types: [python]
          - id: check-sys-path-manipulation
            name: check-sys-path-manipulation
            entry: scripts/hooks/python/check_sys_path_manipulation.sh
            language: system
            types: [python]
          - id: check-getattr-setattr
            name: check-getattr-setattr
            entry: scripts/hooks/python/check_getattr_setattr.sh
            language: system
            types: [python]
          - id: check-lightweight-init
            name: check-lightweight-init
            entry: scripts/hooks/python/check_lightweight_init.sh
            language: system
            types: [python]
          - id: check-all-in-init
            name: check-all-in-init
            entry: scripts/hooks/python/check_all_in_init.sh
            language: system
            types: [python]
          - id: check-private-impl-imports
            name: check-private-impl-imports
            entry: scripts/hooks/python/check_private_impl_imports.sh
            language: system
            types: [python]
          - id: check-no-dataclass
            name: check-no-dataclass
            entry: scripts/hooks/python/models/check_no_dataclass.sh
            language: system
            types: [python]
          - id: check-data-holder-naming
            name: check-data-holder-naming
            entry: scripts/hooks/python/models/check_data_holder_naming.sh
            language: system
            types: [python]
          - id: check-tuple-param-bypass
            name: check-tuple-param-bypass
            entry: scripts/hooks/python/models/check_tuple_param_bypass.sh
            language: system
            types: [python]
          - id: check-declared-instance-attrs
            name: check-declared-instance-attrs
            entry: scripts/hooks/python/models/check_declared_instance_attrs.sh
            language: system
            types: [python]
          - id: check-runtime-loader-paths
            name: check-runtime-loader-paths
            entry: scripts/hooks/check_runtime_loader_paths.sh
            language: system
            types_or: [python, shell]
            exclude: ^scripts/hooks/
          - id: uv-sync
            name: sync development environment
            entry: uv sync --inexact
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-commit, pre-merge-commit, pre-push]
          - id: ty
            name: ty check
            entry: uv run --no-sync ty check --error-on-warning src tests
            language: system
            types_or: [python, pyi]
            pass_filenames: false
            require_serial: true
          - id: mypy
            name: strict mypy
            entry: uv run --no-sync mypy --strict --follow-untyped-imports src/klogr tests
            language: system
            stages: [manual]
            types_or: [python, pyi]
            pass_filenames: false
            require_serial: true
          - id: unittest
            name: full unit test suite
            entry: uv run --no-sync python -m unittest discover -v
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-merge-commit]
