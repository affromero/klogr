---
name: Checks

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python: ['3.10', '3.12']
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@v7
              with:
                  python-version: ${{ matrix.python }}
            - run: uv sync
            - run: uv run pre-commit run --all-files
            - run: uv run python -m unittest discover -v
            - run: uv run mypy --strict --follow-untyped-imports src/klogr tests
            - run: uv build
